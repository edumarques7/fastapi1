services:
  app:
    build: .
    ports:
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    environment:
      DB_URL: postgresql+asyncpg://postgres:local_dev_password@postgresql:5432/fastapi1
      JWT_SECRET: ${JWT_SECRET:-local-development-only-change-this-jwt-secret-before-deploying}
    depends_on:
      postgresql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/artigos/', timeout=5)"]
      interval: 10s
      timeout: 6s
      retries: 5
      start_period: 20s

  postgresql:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: fastapi1
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  postgres_data:
